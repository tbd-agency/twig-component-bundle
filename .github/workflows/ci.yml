name: CI

on:
  push:
  pull_request:
  schedule:
    -   cron: '0 0 1,16 * *'

jobs:
  php-stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      -   name: Checkout code
          uses: actions/checkout@v4

      -   name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: 8.4

      -   name: Configure Composer auth
          run: composer config --global --auth github-oauth.github.com ${{ secrets.COMPOSER_AUTH_TOKEN }}

      -   name: Install dependencies
          uses: ramsey/composer-install@v3

      -   name: PHPStan
          run: vendor/bin/phpstan analyse